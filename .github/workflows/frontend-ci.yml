name: Frontend CI

on:
  push: # mọi nhánh, chỉ khi có thay đổi ở frontend
    paths:
      - 'frontent-react-starter/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontent-react-starter/**'
      - '.github/workflows/frontend-ci.yml'

# Hủy lần chạy cũ khi cùng ref có commit mới
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontent-react-starter

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontent-react-starter/.nvmrc
          cache: npm
          cache-dependency-path: frontent-react-starter/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontent-react-starter/.nvmrc
          cache: npm
          cache-dependency-path: frontent-react-starter/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontent-react-starter/.nvmrc
          cache: npm
          cache-dependency-path: frontent-react-starter/package-lock.json
      - run: npm ci
      # `tsc -b` (kiểm kiểu) rồi `vite build`. VITE_API_URL là giá trị GIẢ, chỉ cần có để bundle dựng được
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
