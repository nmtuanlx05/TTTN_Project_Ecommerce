name: Backend CI

on:
  push: # mọi nhánh, chỉ khi có thay đổi ở backend
    paths:
      - 'backend-nestjst-starter/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend-nestjst-starter/**'
      - '.github/workflows/backend-ci.yml'

# Hủy lần chạy cũ khi cùng ref có commit mới
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend-nestjst-starter

env:
  # Giá trị GIẢ: prisma.config.ts bắt buộc có DATABASE_URL, nhưng generate không kết nối DB
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
  CHECKPOINT_DISABLE: '1'

jobs:
  lint-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend-nestjst-starter/.nvmrc
          cache: npm
          cache-dependency-path: backend-nestjst-starter/package-lock.json
      - run: npm ci
      # Lint dùng type-check nên cần src/generated (bị gitignore)
      - run: npx prisma generate
      - run: npm run lint:check
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend-nestjst-starter/.nvmrc
          cache: npm
          cache-dependency-path: backend-nestjst-starter/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend-nestjst-starter/.nvmrc
          cache: npm
          cache-dependency-path: backend-nestjst-starter/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  # Test trên MySQL THẬT (không mock Prisma). DB tạm dựng bằng docker-compose.test.yml, giống hệt máy dev.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Mật khẩu GIẢ của DB tạm trong container (khớp docker-compose.test.yml), không phải secret thật
      DATABASE_URL: mysql://root:test_only_password@127.0.0.1:3308/ecommerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend-nestjst-starter/.nvmrc
          cache: npm
          cache-dependency-path: backend-nestjst-starter/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Dựng MySQL tạm và chờ healthy
        run: npm run db:test:up
      - name: Áp toàn bộ migration lên DB trống (prisma migrate deploy)
        run: npm run db:test:migrate
      - name: Test trên MySQL thật
        run: npm run test:db
      - name: Log MySQL (chỉ khi lỗi)
        if: failure()
        run: docker compose -p ecommerce_test -f docker-compose.test.yml logs --no-color
      - name: Dọn DB tạm
        if: always()
        run: npm run db:test:down
